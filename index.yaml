    created: "2026-09-23T14:04:37.469857638Z"
    description: 'CustomResourceDefinitions for Omnia, as their own release. Helm
      installs a chart''s crds/ directory on FIRST INSTALL ONLY — never on upgrade,
      never templated — so a schema change or a newly enabled enterprise.enabled simply
      never reached an existing cluster, and nothing reported it. These are templates
      in a separate release instead, which makes `helm upgrade` work. The three failures
      that originally drove the CRDs into crds/ (#1796) are all artifacts of CRDs
      sharing a release with custom resources OF those kinds: a separate release dissolves
      the install-order and reinstall-ownership ones outright, and helm.sh/resource-policy=keep
      on every CRD neutralises the uninstall cascade.'
